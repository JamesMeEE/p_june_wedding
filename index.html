<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>June &amp; Non — The Wedding</title>
<meta name="description" content="Chenisa & Sranon — Save the date 14.01.2027">
<meta property="og:title" content="June & Non — The Wedding">
<meta property="og:description" content="Please join us for our wedding celebration · 14.01.2027">
<meta name="theme-color" content="#f1ece2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%237a1414' d='M16 28C7 21 3 16.5 3 11.2 3 7.2 6.1 4.5 9.6 4.5c2.6 0 4.9 1.5 6.4 4 1.5-2.5 3.8-4 6.4-4 3.5 0 6.6 2.7 6.6 6.7C29 16.5 25 21 16 28z'/%3E%3C/svg%3E">
<link rel="preload" as="image" href="assets/bg-lace.webp" fetchpriority="high">
<link rel="preload" as="font" type="font/woff2" href="assets/cronde.woff2" crossorigin>
<style>
@font-face{font-family:'SovStation';src:url('assets/sov-station.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Cronde';src:url('assets/cronde.woff2') format('woff2');font-display:swap}

:root{
  --cw:min(100vw, 480px);         /* ความกว้างการ์ด */
  --cream:#f5f3e9;
  --ink:#2a2420;
  --wine:#5a0d0d;
  --thai:system-ui, -apple-system, 'Segoe UI', 'Noto Sans Thai', 'Thonburi', 'Leelawadee UI', sans-serif;
  --ease-out:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#ddd6c8;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}      /* ไม่ให้ซูม (ทั้งถ่างนิ้วและแตะสองครั้ง) */
button,a,label{touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{font-family:var(--thai);color:var(--ink);overflow-x:hidden}
body.locked{overflow:hidden}
img{display:block;max-width:none;-webkit-user-drag:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.app{width:var(--cw);margin:0 auto;overflow:hidden;background:var(--cream);box-shadow:0 0 40px rgba(60,45,25,.25)}

/* ---------- ระบบวางตำแหน่ง: ใช้พิกัดพิกเซลจากไฟล์แบบ ----------
   แต่ละหน้ากำหนด --dw = ความกว้างของไฟล์แบบ แล้ว --u = 1px ของแบบ
   ชิ้นงานใส่ style="--x:..;--y:..;--w:.." (หน่วยพิกเซลของแบบ)            */
.page{position:relative;--u:calc(var(--cw) / var(--dw))}
.a{position:absolute;left:calc(var(--x) * var(--u));top:calc(var(--y) * var(--u));width:calc(var(--w) * var(--u))}
.a.h{height:calc(var(--h) * var(--u))}
img.a, .a > img{height:auto}
.a > img{width:100%}
a.a, button.a{display:block}
.tap{transition:scale .25s var(--ease-out)}
.tap:active{scale:.96}
/* ของที่กดได้ เด้งเบา ๆ ตลอดเวลา */
@keyframes bob{0%,100%{scale:1}30%{scale:1.07}52%{scale:.985}72%{scale:1.03}}
.bob{animation:bob 2.2s ease-in-out infinite;animation-delay:var(--bd,0s)}
.deco{pointer-events:none}

/* โผล่ขึ้นตอนเลื่อนถึง */
.reveal{opacity:0;translate:0 calc(26 * var(--u));transition:opacity 1s var(--ease-soft), translate 1.2s var(--ease-out);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;translate:0 0}

/* ================= หน้า 1–2 : พื้นลูกไม้ ================= */
.p-lace{--dw:744;height:calc(2722 * var(--u));background:#f1ece2 url('assets/bg-lace.webp') top center/100% auto repeat-y}

.envelope{position:absolute;inset:0;pointer-events:none}
.envelope > *{pointer-events:auto}
.strip{rotate:-1.5deg;filter:drop-shadow(0 calc(3 * var(--u)) calc(5 * var(--u)) rgba(0,0,0,.25))}
.heart{translate:0 calc(150 * var(--u));transition:translate 2.2s var(--ease-out) .5s}
.envelope.in .heart{translate:0 0}
.flowers{filter:drop-shadow(0 calc(4 * var(--u)) calc(6 * var(--u)) rgba(0,0,0,.2));pointer-events:none}

/* แผ่นเสียง */
.vinyl{
  height:calc(var(--w) * var(--u));border-radius:50%;
  background:
    radial-gradient(circle,#2a2a2a 0 2.2%,#e9e5da 2.6% 21%,#111 21.6% 23%,transparent 23.4%),
    repeating-radial-gradient(circle,#141414 0 1.6%,#262626 1.6% 2.4%);
  box-shadow:0 calc(4 * var(--u)) calc(9 * var(--u)) rgba(0,0,0,.4);
}
.vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 20deg,rgba(255,255,255,.2),transparent 14%,transparent 48%,rgba(255,255,255,.14) 54%,transparent 66%,transparent)}
.vinyl.playing{animation:spin 4s linear infinite}      /* เพลงเล่น = หมุน, เพลงหยุด = เด้งชวนให้กด */
.vinyl.hint::before{content:"";position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--wine);opacity:0;animation:ping 2.4s var(--ease-out) infinite}   /* ชวนให้แตะเปิดเพลง */
@keyframes ping{0%{scale:1;opacity:.55}100%{scale:1.45;opacity:0}}
@keyframes spin{to{rotate:360deg}}
/* ชื่อเพลงวนรอบแผ่นเสียง (อยู่นิ่ง ไม่หมุนตามแผ่น) โผล่ตอนเพลงกำลังเล่น
   วางทีละพยางค์ด้วย JS (layoutRing) เพื่อให้สระ/วรรณยุกต์ไทยไม่เพี้ยน */
.np{height:calc(var(--w) * var(--u));pointer-events:none;opacity:0;transition:opacity .8s var(--ease-soft);
  font-family:'SovStation', var(--thai);color:var(--wine)}
.np span{position:absolute;left:50%;top:50%;transform-origin:0 0;line-height:1;white-space:pre}
.vinyl.playing ~ .np{opacity:1}

/* นับถอยหลัง */
.cd{position:absolute;left:0;right:0;top:calc(1866 * var(--u));height:calc(72 * var(--u));
  font-family:'Cronde', 'Times New Roman', serif;font-size:calc(56 * var(--u));line-height:calc(72 * var(--u));color:#111}
.cd span{position:absolute;top:0;left:calc(var(--c) * var(--u));translate:-50% 0;white-space:nowrap;font-variant-numeric:tabular-nums}
.cd i{font-style:normal;font-size:.7em;translate:-50% -8%}

/* ================= หน้า 3 : สวน / Location ================= */
.p-garden{--dw:946;margin-top:calc(-74 * var(--u))}      /* ให้ลายลูกไม้ลอดใต้ขอบกระดาษฉีก */
.p-garden > .bg, .p-theme > .bg, .p-wishes > .bg{width:100%;height:auto}

/* ================= หน้า 4 : Theme / ตอบรับ ================= */
.p-theme{--dw:945;margin-top:calc(-140 * var(--u));height:calc(1580 * var(--u));
  background:linear-gradient(transparent 0 calc(700 * var(--u)), var(--cream) calc(700 * var(--u)))}
.p-theme > .bg{position:absolute;left:0;top:0}
.rsvp-box{background:rgba(120,120,120,.5);border-radius:calc(30 * var(--u))}
.field{
  border:0;outline:0;border-radius:calc(4 * var(--u));background:rgba(255,255,255,.55);
  font-family:var(--thai);font-size:16px;line-height:1;color:#1d1a17;padding:0 calc(12 * var(--u));
  -webkit-appearance:none;appearance:none;
}
.field:focus{background:rgba(255,255,255,.85);box-shadow:0 0 0 2px rgba(96,67,48,.5)}
input[type=number].field::-webkit-outer-spin-button,input[type=number].field::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number].field{-moz-appearance:textfield}
.step{
  height:calc(var(--w) * var(--u));border-radius:50%;background:#604330;color:#f5f0e4;
  font-family:Georgia, 'Times New Roman', serif;font-size:calc(40 * var(--u));line-height:1;
  display:grid;place-items:center;box-shadow:0 calc(2 * var(--u)) calc(5 * var(--u)) rgba(40,25,15,.35), inset 0 0 0 calc(2 * var(--u)) rgba(245,240,228,.35);
}
.step::after{content:"";position:absolute;inset:-9px}      /* ขยายพื้นที่กดให้กดง่ายบนมือถือ */
.step:disabled{opacity:.45}
.field.num{text-align:center;padding:0;font-family:Georgia, 'Times New Roman', serif;font-weight:600}
.done-msg{display:none;place-items:center;text-align:center;padding:calc(20 * var(--u));background:rgba(110,110,110,.92);border-radius:calc(30 * var(--u));color:#fff;font-size:calc(30 * var(--u));line-height:1.5;font-weight:500}
.done-msg.on{display:grid}

/* ================= หน้า 5 : คำอวยพร ================= */
.p-wishes{--dw:1289;margin-top:calc(-24 * var(--u))}
.wish-field{
  border:0;outline:0;resize:none;border-radius:calc(22 * var(--u));background:rgba(255,255,255,.42);
  font-family:var(--thai);font-size:16px;line-height:1.5;color:#2b2622;padding:calc(34 * var(--u)) calc(48 * var(--u));
  -webkit-appearance:none;appearance:none;
}
input.wish-field{padding-top:0;padding-bottom:0}
.wish-field::placeholder{font-style:italic;font-weight:300;color:#55504a;opacity:1}
.wish-field:focus{background:rgba(255,255,255,.7)}
.hot{border-radius:calc(24 * var(--u))}
.badge{position:absolute;right:calc(-6 * var(--u));top:calc(-6 * var(--u));width:calc(64 * var(--u));height:calc(64 * var(--u));border-radius:50%;
  background:#3c8f4f;color:#fff;font-size:calc(40 * var(--u));line-height:calc(64 * var(--u));text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35);
  scale:0;transition:scale .35s var(--ease-out)}
.badge.on{scale:1}
.badge.busy{background:#604330;font-size:calc(24 * var(--u));width:auto;min-width:calc(64 * var(--u));padding:0 calc(12 * var(--u));border-radius:999px;font-variant-numeric:tabular-nums}
.badge.err{background:#a3271f}
.pick{position:absolute}
.sending{position:absolute;inset:0;display:none;place-items:center;background:rgba(30,26,18,.6);color:#fff;text-align:center;font-size:17px;line-height:1.7;z-index:5;padding:24px}
.sending.on{display:grid}
.sending b{display:block;font-family:'Cronde',serif;font-weight:400;font-size:44px}
.thanks{position:absolute;inset:0;display:none;place-items:center;background:rgba(30,26,18,.62);color:#fff;text-align:center;z-index:5;padding:24px}
.thanks.on{display:grid}
.thanks h3{font-family:'Cronde',serif;font-weight:400;font-size:40px;margin-bottom:8px}
.thanks button{margin-top:16px;padding:10px 22px;border-radius:999px;border:1px solid #fff;color:#fff;font-size:14px}

/* ---------- ดูรูปใหญ่ ---------- */
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(18,15,10,.9);display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .35s var(--ease-soft), visibility 0s .35s}
.lightbox.on{opacity:1;visibility:visible;transition:opacity .35s var(--ease-soft), visibility 0s}
.lightbox figure{background:#f4f1e8;padding:6px 6px 10px;box-shadow:0 20px 50px rgba(0,0,0,.5);width:min(96vw, 560px, calc((100vh - 110px) * 2 / 3));width:min(96vw, 560px, calc((100dvh - 110px) * 2 / 3));scale:.94;transition:scale .45s var(--ease-out)}
.lightbox.on figure{scale:1}
.lightbox img{width:100%;height:auto;aspect-ratio:2/3;object-fit:cover;background:#d9d9de}
.lb-nav{display:flex;align-items:center;justify-content:center;gap:22px;padding-top:12px}
.lb-btn{width:46px;height:46px;border-radius:50%;background:#604330;display:grid;place-items:center;box-shadow:0 2px 6px rgba(40,25,15,.3)}
.lb-btn svg{width:20px;height:20px;stroke:#f5f0e4;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.lb-btn:active{scale:.92}
.lb-count{font-family:'Cronde',serif;font-size:17px;letter-spacing:.18em;color:#4a3f35;min-width:64px;text-align:center}
.lb-close{position:absolute;right:14px;top:14px;width:44px;height:44px;color:#fff;font-size:26px}

/* ---------- กล้องอัดวิดีโออวยพร ---------- */
.cam{position:fixed;inset:0;z-index:90;background:#000;display:none;color:#fff}
.cam.on{display:block}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.cam.mirror video{transform:scaleX(-1)}      /* กล้องหน้า: แสดงแบบกระจกทั้งตอนถ่ายและตอนดูตัวอย่าง */
.cam-top,.cam-bottom,.cam-review{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 18px}
.cam-top{top:0;padding-top:max(14px, env(safe-area-inset-top));background:linear-gradient(rgba(0,0,0,.55),transparent)}
.cam-bottom,.cam-review{bottom:0;padding-bottom:max(22px, env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6))}
.cam-ic{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;font-size:22px;line-height:1}
.cam-time{font-family:'Cronde',serif;font-size:22px;letter-spacing:.06em;padding:4px 14px;border-radius:999px;background:rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.cam.recording .cam-time{background:#b3261e}
.cam-side{width:104px;font-size:13px;color:#fff;text-align:left;line-height:1.3}
.cam-side:last-child{text-align:right}
.cam-rec{width:74px;height:74px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.cam-rec::before{content:"";width:56px;height:56px;border-radius:50%;background:#e0352b;transition:all .25s var(--ease-out)}
.cam.recording .cam-rec::before{width:28px;height:28px;border-radius:7px}
.cam-review{display:none;gap:12px}
.cam-review button{flex:1;padding:14px;border-radius:999px;font-size:15px;color:#fff;border:1px solid #fff}
.cam-review .use{background:#f5f0e4;color:#3a2a1e;border-color:#f5f0e4;font-weight:600}
.cam.review .cam-review{display:flex}
.cam.review .cam-bottom,.cam.review #camFlip,.cam.recording #camFlip,.cam.recording #camLib{visibility:hidden}
.cam.review .cam-bottom{display:none}
.cam-msg{position:absolute;left:24px;right:24px;top:50%;translate:0 -50%;text-align:center;font-size:15px;line-height:1.7;display:none}
.cam.msg .cam-msg{display:block}
.cam.msg .cam-rec{visibility:hidden}

.toast{position:fixed;left:50%;bottom:28px;translate:-50% 20px;background:rgba(30,27,20,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;
  opacity:0;transition:opacity .3s, translate .3s;z-index:99;max-width:90vw;text-align:center;pointer-events:none}
.toast.on{opacity:1;translate:-50% 0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01s !important;transition-delay:0s !important;animation:none !important}
}
</style>
</head>

<div class="app">

  <!-- ================= หน้า 1–2 ================= -->
  <section class="page p-lace">
    <h1 class="sr">June &amp; Non — The Wedding · Chenisa &amp; Sranon · 14.01.2027</h1>
    <img class="a reveal in" style="--x:235;--y:82;--w:272" fetchpriority="high" src="assets/logo.webp" alt="June Non — The Wedding" width="640" height="490">

  </section>

  <!-- ================= หน้า 3 : Location / Plan ================= -->
  <section class="page p-garden">
    <img class="bg" src="assets/bg-garden.webp" alt="" width="945" height="1664" loading="lazy">
    <img class="a reveal" style="--x:199;--y:114;--w:542" src="assets/location.webp" alt="Location — สักกายะ | SAK-KA-YA" width="542" height="194" loading="lazy">

  <!-- ================= หน้า 4 : Theme / ตอบรับ ================= -->
  <section class="page p-theme">

<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const C = CONFIG, when = new Date(C.date);

$('#mapBtn').href = C.mapUrl;
$('#lineBtn').href = C.lineUrl;

/* ---------- toast ---------- */
let tt;
function toast(msg, ms = 3000) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), ms); }

/* ---------- นับถอยหลัง ---------- */
const pad = n => String(n).padStart(2, '0');
function tick() {
  const s = Math.max(0, Math.floor((when - Date.now()) / 1000));
  $('#cd-d').textContent = pad(Math.floor(s / 86400));
  $('#cd-h').textContent = pad(Math.floor(s % 86400 / 3600));
  $('#cd-m').textContent = pad(Math.floor(s % 3600 / 60));
  $('#cd-s').textContent = pad(s % 60);
}
tick(); setInterval(tick, 1000);

/* ---------- เพลง ----------
   เบราว์เซอร์ไม่ยอมให้เล่นเสียงจนกว่าจะมีการแตะหน้าจอ จึงเริ่มเพลงตอนแตะครั้งแรก
   ระหว่างเล่น แผ่นเสียงหมุนและมีป้ายชื่อเพลง · กดแผ่นเสียงเพื่อหยุด/เล่นต่อ      */
const audio = $('#music'), vinyl = $('#vinyl');
function layoutRing() {
  const box = $('#nowPlaying'), size = box.clientWidth; if (!size) return;
  const R = size * 91 / 184, fs = size * 16.5 / 184;
  const clusters = t => window.Intl && Intl.Segmenter ? [...new Intl.Segmenter('th', { granularity: 'grapheme' }).segment(t)].map(x => x.segment)
    : (t.match(/[\s\S][ัิ-ฺ็-๎]*/g) || []);
  const ctx = document.createElement('canvas').getContext('2d');
  let ang = 18 * Math.PI / 180, html = '';              // เริ่มเยื้องขวาจากด้านบนเล็กน้อย วนตามเข็ม
  for (const [text, k, track] of [[C.songTitle, 1, .04], ['  ·  ', 1, 0], [C.songArtist, .94, .22]]) {
    const px = fs * k; ctx.font = `${px}px SovStation, sans-serif`;
    for (const g of clusters(text)) {
      const w = ctx.measureText(g).width + track * px, mid = ang + w / 2 / R;
      html += `<span style="font-size:${px.toFixed(2)}px;transform:rotate(${mid.toFixed(4)}rad) translateY(${(-R).toFixed(2)}px) translate(-50%,-50%)">${g.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</span>`;
      ang += w / R;
    }
  }
  box.innerHTML = html;
}
layoutRing(); addEventListener('resize', layoutRing);
if (document.fonts && document.fonts.load) document.fonts.load('16px SovStation', C.songTitle + C.songArtist).then(layoutRing, () => {});
vinyl.setAttribute('aria-label', `เปิด/ปิดเพลง ${C.songTitle} — ${C.songArtist}`);
audio.addEventListener('play', () => vinyl.classList.add('playing'));
audio.addEventListener('pause', () => vinyl.classList.remove('playing'));
const playMusic = () => { if (!audio.src) audio.src = C.music; return audio.play(); };
let autoAt = 0;
vinyl.addEventListener('click', () => {
  if (performance.now() - autoAt < 700) return;      // การแตะครั้งนี้เพิ่งเริ่มเพลงเอง ไม่ต้องสลับซ้ำ
  if (audio.paused) playMusic().catch(() => toast('ยังเล่นเพลงไม่ได้ (ไม่พบไฟล์เพลง)'));
  else audio.pause();
});
if (C.autoplay) {
  // เบราว์เซอร์นับเฉพาะ "การแตะ" เป็นการอนุญาตให้เล่นเสียง (การเลื่อนจอไม่นับ) จึงลองใหม่ทุกครั้งที่มีการแตะจนกว่าจะเล่นได้
  const evs = ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'mousedown', 'click', 'keydown'];
  const stop = () => { evs.forEach(ev => document.removeEventListener(ev, first, true)); vinyl.classList.remove('hint'); };
  const first = () => { if (!audio.paused) return; autoAt = performance.now(); playMusic().then(stop).catch(() => { autoAt = 0; }); };
  evs.forEach(ev => document.addEventListener(ev, first, { capture: true, passive: true }));
  vinyl.classList.add('hint');
  playMusic().then(stop).catch(() => {});             // บางเครื่องยอมให้เล่นได้เลยตั้งแต่เปิดหน้า
}
// ออกจากหน้าเว็บ / สลับแอป / ล็อกจอ → เพลงหยุดทันที · กลับมาแล้วเล่นต่อ
let resumeOnShow = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { resumeOnShow = !audio.paused; audio.pause(); }
  else if (resumeOnShow) { resumeOnShow = false; playMusic().catch(() => {}); }
});
window.addEventListener('pagehide', () => audio.pause());
// กันซูมด้วยการถ่างนิ้วบน iOS (Safari ไม่สนใจ user-scalable=no)
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));

/* ---------- เลื่อนแล้วค่อย ๆ โผล่ ---------- */
const io = new IntersectionObserver(es => {
  es.filter(e => e.isIntersecting)
    .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)
    .forEach((e, i) => { e.target.style.setProperty('--d', (i * 0.12) + 's'); e.target.classList.add('in'); io.unobserve(e.target); });
}, { threshold: .1, rootMargin: '0px 0px -6% 0px' });
$$('.reveal:not(.in)').forEach(el => io.observe(el));

/* ---------- ดูรูปใหญ่ 3 รูป ---------- */
const lb = $('#lightbox'); let li = 0;
function showPhoto(i) {
  li = (i + C.photos.length) % C.photos.length;
  $('#lbImg').src = C.photos[li];
  $('#lbCap').textContent = `${li + 1} / ${C.photos.length}`;
}
let lbPre = false;
function openLb(i) { if (!lbPre) { lbPre = true; C.photos.forEach(u => { new Image().src = u; }); } showPhoto(i); lb.classList.add('on'); document.body.classList.add('locked'); }
function closeLb() { lb.classList.remove('on'); document.body.classList.remove('locked'); }
$('#strip').addEventListener('click', () => openLb(0));
$('#lbPrev').addEventListener('click', () => showPhoto(li - 1));
$('#lbNext').addEventListener('click', () => showPhoto(li + 1));
$('#lbClose').addEventListener('click', closeLb);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') showPhoto(li - 1); if (e.key === 'ArrowRight') showPhoto(li + 1);
});
let sx = null;
lb.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', e => {
  if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 40) showPhoto(li + (dx < 0 ? 1 : -1));
});

/* ---------- ส่งข้อมูลเข้าเซิร์ฟเวอร์ ---------- */
async function api(path, body) {
  const res = await fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let out = null; try { out = await res.json(); } catch (e) { /* ไม่ใช่ JSON */ }
  if (!res.ok || !out || !out.ok) { const err = new Error((out && out.error) || 'HTTP ' + res.status); err.shown = !!(out && out.error); throw err; }
  return out;
}
const failMsg = e => e && e.shown ? e.message : 'ส่งไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่';

/* ปุ่มบวก/ลบ จำนวนคน */
const cnt = $('#r-count'), CMIN = 1, CMAX = 20;
function setCount(v) {
  v = Math.min(CMAX, Math.max(CMIN, parseInt(v, 10) || CMIN));
  cnt.value = v; $('#cMinus').disabled = v <= CMIN; $('#cPlus').disabled = v >= CMAX;
}
$('#cMinus').addEventListener('click', () => setCount(+cnt.value - 1));
$('#cPlus').addEventListener('click', () => setCount(+cnt.value + 1));
cnt.addEventListener('change', () => setCount(cnt.value));
setCount(1);

/* ตอบรับเข้าร่วมงาน */
let rsvpBusy = false;
$('#rsvpForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (rsvpBusy) return;
  const f = e.target, name = f.name.value.trim(), count = parseInt(f.count.value, 10);
  if (!name) { toast('กรุณากรอกชื่อผู้ร่วมงาน'); f.name.focus(); return; }
  if (!(count >= 1 && count <= 20)) { toast('กรุณากรอกจำนวนคน'); f.count.focus(); return; }
  rsvpBusy = true; toast('กำลังส่งข้อมูล…', 15000);
  try {
    await api('rsvp', { name, count });
    $('#rsvpDone').classList.add('on'); toast('ส่งข้อมูลเรียบร้อย');
  } catch (err) { console.error(err); toast(failMsg(err), 4500); }
  rsvpBusy = false;
});

/* ---------- อัปโหลดไฟล์: ส่งตรงเข้าเซิร์ฟเวอร์เป็นชิ้น ครั้งละ 3 ชิ้นพร้อมกัน ----------
   เริ่มอัปโหลดทันทีที่แนบ ระหว่างที่แขกยังพิมพ์คำอวยพรอยู่ พอกดส่งจึงแทบไม่ต้องรอ   */
function startUpload(blob, kind, ext, onProgress) {
  const ctl = new AbortController();
  const promise = (async () => {
    const { id, chunk } = await api('upload/start', { kind, ext, size: blob.size });
    const offs = []; for (let o = 0; o < blob.size; o += chunk) offs.push(o);
    let next = 0, sent = 0;
    const worker = async () => {
      while (next < offs.length) {
        const o = offs[next++], part = blob.slice(o, o + chunk);
        for (let attempt = 0; ; attempt++) {
          try {
            const r = await fetch(`/api/upload/${id}?offset=${o}`, { method: 'PUT', body: part, signal: ctl.signal, headers: { 'Content-Type': 'application/octet-stream' } });
            if (!r.ok) throw new Error('chunk ' + r.status);
            break;
          } catch (err) {
            if (ctl.signal.aborted || attempt >= 3) throw err;
            await new Promise(ok => setTimeout(ok, 900 * (attempt + 1)));
          }
        }
        sent += part.size; onProgress(sent / blob.size);
      }
    };
    await Promise.all([worker(), worker(), worker()]);
    return id;
  })();
  promise.catch(() => {});
  return { promise, abort: () => ctl.abort() };
}

const att = { photo: null, video: null };          // { blob, ext, up, pct, state: 'busy' | 'done' | 'err' }
const badgeOf = kind => $(kind === 'photo' ? '#photoBadge' : '#videoBadge');
let onAttProgress = null;
function paintBadge(kind) {
  const a = att[kind], b = badgeOf(kind);
  b.className = 'badge' + (a ? ' on' + (a.state === 'busy' ? ' busy' : a.state === 'err' ? ' err' : '') : '');
  b.textContent = !a ? '' : a.state === 'busy' ? Math.round(a.pct * 100) + '%' : a.state === 'err' ? '!' : '✓';
}
function beginUpload(kind) {
  const a = att[kind]; if (!a) return;
  a.state = 'busy'; a.pct = 0; paintBadge(kind);
  a.up = startUpload(a.blob, kind, a.ext, p => { if (att[kind] !== a) return; a.pct = p; paintBadge(kind); if (onAttProgress) onAttProgress(); });
  a.up.promise.then(() => { if (att[kind] === a) { a.state = 'done'; paintBadge(kind); } },
    err => { if (att[kind] !== a) return; console.error(err); a.state = 'err'; paintBadge(kind); if (err && err.shown) toast(err.message, 4500); });
}
function setAttachment(kind, blob, ext) {
  if (att[kind] && att[kind].up) att[kind].up.abort();
  att[kind] = blob ? { blob, ext, up: null, pct: 0, state: 'busy' } : null;
  paintBadge(kind);
  if (blob) beginUpload(kind);
}
const extOf = (file, fallback) => { const m = /\.([a-z0-9]{2,5})$/i.exec(file.name || ''); return (m ? m[1] : fallback).toLowerCase(); };

/* รูป: ย่อก่อนส่ง (ด้านยาวไม่เกิน 2000px) */
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .88));
    if (blob) return { blob, ext: 'jpg' };
  } catch (e) { /* ย่อไม่ได้ก็ส่งไฟล์เดิม */ }
  return { blob: file, ext: extOf(file, 'jpg') };
}
$('#pickPhoto').addEventListener('click', () => $('#photoInput').click());
$('#photoInput').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  const s = await shrink(f);
  setAttachment('photo', s.blob, s.ext); toast('แนบรูปแล้ว');
});

/* วิดีโอจากไฟล์ (เลือกจากเครื่อง หรือกล้องมือถือกรณีเบราว์เซอร์ไม่รองรับกล้องในหน้าเว็บ) */
function useVideoFile(f) {
  if (!f) return;
  if (f.size > C.maxVideoMB * 1048576) { toast(`วิดีโอใหญ่เกิน ${C.maxVideoMB}MB กรุณาใช้คลิปที่สั้นลง`, 4500); return; }
  setAttachment('video', f, extOf(f, 'mp4')); toast('แนบวิดีโอแล้ว');
}
for (const id of ['#videoInput', '#videoLib']) $(id).addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; closeCam(); useVideoFile(f); });

/* ---------- กล้องในหน้าเว็บ: Full HD, กล้องหน้าแสดงแบบกระจก, จำกัดเวลา ---------- */
const cam = $('#cam'), camView = $('#camView');
let camStream = null, camRec = null, camChunks = [], camBlob = null, camUrl = null, camTimer = null, camFacing = 'user', camLeft = 0;
const canRecord = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
const fmt = s => Math.floor(s / 60) + ':' + pad(s % 60);
function pickMime() {
  const list = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  return list.find(t => MediaRecorder.isTypeSupported(t)) || '';
}
function stopStream() { if (camStream) camStream.getTracks().forEach(t => t.stop()); camStream = null; }
function clearClip() { if (camUrl) URL.revokeObjectURL(camUrl); camUrl = null; camBlob = null; }
async function startStream() {
  stopStream(); clearClip();
  cam.classList.remove('review', 'recording', 'msg');
  cam.classList.toggle('mirror', camFacing === 'user');
  camView.loop = false; camView.removeAttribute('src'); camView.muted = true;
  $('#camTime').textContent = fmt(C.videoSeconds); $('#camHint').textContent = `ยาวสุด ${C.videoSeconds} วินาที`;
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true },
      video: { facingMode: camFacing, width: { ideal: C.videoWidth }, height: { ideal: C.videoHeight }, frameRate: { ideal: 30 } },
    });
    if (!cam.classList.contains('on')) { stopStream(); return; }
    camView.srcObject = camStream; camView.play().catch(() => {});
  } catch (err) {
    console.error(err);
    $('#camMsg').innerHTML = 'เปิดกล้องไม่ได้<br>กรุณาอนุญาตการใช้กล้องและไมโครโฟน<br>หรือกด “เลือกวิดีโอจากเครื่อง” ด้านล่าง';
    cam.classList.add('msg');
  }
}
function openCam() {
  if (!canRecord()) { $('#videoInput').click(); return; }      // เบราว์เซอร์เก่า → ใช้กล้องของมือถือ
  cam.classList.add('on'); document.body.classList.add('locked');
  startStream();
}
function closeCam() {
  if (!cam.classList.contains('on')) return;
  clearInterval(camTimer);
  if (camRec && camRec.state !== 'inactive') { camRec.onstop = null; camRec.stop(); }
  camRec = null; stopStream(); clearClip();
  camView.pause(); camView.srcObject = null; camView.removeAttribute('src'); camView.load();
  cam.classList.remove('on', 'review', 'recording', 'msg', 'mirror'); document.body.classList.remove('locked');
}
function startRec() {
  if (!camStream) return;
  const mimeType = pickMime();
  try { camRec = new MediaRecorder(camStream, { ...(mimeType ? { mimeType } : {}), videoBitsPerSecond: C.videoBitrate, audioBitsPerSecond: 128000 }); }
  catch (e) { camRec = new MediaRecorder(camStream); }
  camChunks = [];
  camRec.ondataavailable = e => { if (e.data && e.data.size) camChunks.push(e.data); };
  camRec.onstop = () => {
    clearInterval(camTimer);
    const type = (camRec.mimeType || mimeType || 'video/mp4').split(';')[0];
    camBlob = new Blob(camChunks, { type }); camChunks = [];
    stopStream();
    cam.classList.remove('recording'); cam.classList.add('review');
    camUrl = URL.createObjectURL(camBlob);
    $('#camTime').textContent = 'ดูตัวอย่าง';
    camView.srcObject = null; camView.src = camUrl; camView.loop = true; camView.muted = false;
    camView.play().catch(() => { camView.muted = true; camView.play().catch(() => {}); });   // บางเครื่องไม่ให้เล่นเสียงเอง → เล่นแบบเงียบ แตะจอเพื่อเปิดเสียง
  };
  camRec.start(1000);
  cam.classList.add('recording');
  camLeft = C.videoSeconds; $('#camTime').textContent = fmt(camLeft);
  camTimer = setInterval(() => { camLeft--; $('#camTime').textContent = fmt(Math.max(0, camLeft)); if (camLeft <= 0) stopRec(); }, 1000);
}
function stopRec() { clearInterval(camTimer); if (camRec && camRec.state !== 'inactive') camRec.stop(); }
camView.addEventListener('click', () => {            // ตอนดูตัวอย่าง: แตะเพื่อเปิดเสียง / หยุด / เล่นต่อ
  if (!cam.classList.contains('review')) return;
  if (camView.muted) { camView.muted = false; camView.play().catch(() => {}); }
  else if (camView.paused) camView.play().catch(() => {}); else camView.pause();
});
$('#pickVideo').addEventListener('click', openCam);
$('#camClose').addEventListener('click', closeCam);
$('#camRec').addEventListener('click', () => (camRec && camRec.state === 'recording') ? stopRec() : startRec());
$('#camFlip').addEventListener('click', () => { camFacing = camFacing === 'user' ? 'environment' : 'user'; startStream(); });
$('#camLib').addEventListener('click', () => $('#videoLib').click());
$('#camRetake').addEventListener('click', startStream);
$('#camUse').addEventListener('click', () => {
  const blob = camBlob; if (!blob) return;
  const ext = blob.type.includes('webm') ? 'webm' : 'mp4';
  camBlob = null; closeCam();
  setAttachment('video', blob, ext); toast('แนบวิดีโอแล้ว');
});

/* ---------- ส่งคำอวยพร ---------- */
let wishBusy = false;
$('#wishForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (wishBusy) return;
  const f = e.target, name = f.name.value.trim(), message = f.message.value.trim();
  if (!name) { toast('กรุณาระบุชื่อเจ้าของคำอวยพร'); f.name.focus(); return; }
  if (!message && !att.photo && !att.video) { toast('เขียนคำอวยพร หรือแนบรูป/วิดีโอก่อนนะคะ'); f.message.focus(); return; }
  wishBusy = true;
  const paint = () => {
    const list = [att.photo, att.video].filter(Boolean);
    const total = list.reduce((n, a) => n + a.blob.size, 0) || 1;
    const p = list.reduce((n, a) => n + a.blob.size * (a.state === 'done' ? 1 : a.pct), 0) / total;
    $('#sendPct').textContent = Math.round((list.length ? p : 1) * 100) + '%';
  };
  onAttProgress = paint; paint(); $('#sending').classList.add('on');
  try {
    for (const kind of ['photo', 'video']) if (att[kind] && att[kind].state === 'err') beginUpload(kind);   // ลองใหม่ถ้ารอบแรกพลาด
    const photoId = att.photo ? await att.photo.up.promise : null;
    const videoId = att.video ? await att.video.up.promise : null;
    await api('wish', { name, message, photoId, videoId });
    f.reset(); att.photo = att.video = null; paintBadge('photo'); paintBadge('video');
    $('#wishThanks').classList.add('on');
  } catch (err) { console.error(err); toast(failMsg(err), 4500); }
  onAttProgress = null; $('#sending').classList.remove('on');
  wishBusy = false;
});
$('#wishAgain').addEventListener('click', () => $('#wishThanks').classList.remove('on'));
</script>
</body>
</html>
